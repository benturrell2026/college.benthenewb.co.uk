<!DOCTYPE html>
<html lang="en-gb">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rodd's Coffee</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
        <link rel="shortcut icon" href="/assets/images/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Rodd's" />
        <link rel="manifest" href="/assets/images/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
    </head>
    <body>
        <ul class="topnav">
            <li><img src="/assets/images/favicon-51x51.png"></li>
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/news">News</a></li>
            <li><a href="/contact" class="active">Contact</a></li>
            <li class="right"><a href="/tos">Terms and Conditions</a></li>
        </ul>
        <h1 class="lexend-regular">Contact Rodds</h1>
        <p class="lexend-regular">Have questions or feedback? Get in touch with us!</p>

        <p id="form-note">Practice form: nothing will be stored or sent.</p>
        <form id="contact-form" aria-describedby="form-note">
            <label for="visitor-name">Name (required)</label>
            <input id="visitor-name" name="visitor-name" type="text" required>

            <label for="visitor-email">Email (required)</label>
            <input id="visitor-email" name="visitor-email" type="email" required>

            <label for="visitor-message">Message (required)</label>
            <textarea id="visitor-message" name="visitor-message" rows="5" required></textarea>

            <button id="check-form" type="button">Send Message</button>
            <p id="form-result" role="status"></p>
        </form>
        <footer>
            <p class="lexend-regular">Copyright &copy; 2024 Rodd's Coffee</p>
        </footer>
    </body>
</html>
