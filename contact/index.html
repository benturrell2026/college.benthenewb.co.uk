<!DOCTYPE html>
<html lang="en-gb">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rodd's Coffee</title>
        <meta property="og:title" content="Rodd's Coffee">
        <meta property="og:description" content="Ben's SHCG Coursework Website">
        <meta property="og:url" content="https://college.benthenewb.co.uk">
        <meta property="og:image" content="https://college.benthenewb.co.uk/assets/images/favicon-96x96.png">
        <meta property="og:type" content="website">
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
        <link rel="shortcut icon" href="/assets/images/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Rodd's" />
        <link rel="manifest" href="/assets/images/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
        <script src="/contact/form.js" defer></script>
    </head>
    <body>
        <ul class="topnav">
            <li><img src="/assets/images/favicon-51x51.png"></li>
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/contact" class="active">Contact</a></li>
            <li><a href="/about">About</a></li>
            <li class="right"><a href="/tos">Terms and Conditions</a></li>
        </ul>

        <section class="centre">
            <h1 class="lexend-regular">Contact Rodds</h1>
        </section>
        <section class="centre">
            <p class="lexend-regular">Have questions or feedback? Get in touch with us!</p>
        </section>
        <section class="centre">
            <p id="form-note">Practice form: nothing will be stored or sent.</p>
        </section>
        <section class="centre">
            <form>
                <label for="name" class="lexend-regular">Name</label>
                <input id="name" name="name" type="text" required>
                <label for="email" class="lexend-regular">Email</label>
                <input id="email" name="email" type="email" required>
                <label for="message" class="lexend-regular">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                <button type="submit" class="lexend-regular">Send message</button>
            </form>
        </section>
        <footer>
            <p class="lexend-regular">Copyright &copy; 2024 Rodd's Coffee</p>
        </footer>
    </body>
</html>
